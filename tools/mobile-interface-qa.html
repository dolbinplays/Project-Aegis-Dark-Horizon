<!doctype html><meta charset="utf-8"><title>AEGIS mobile interface QA</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#081724;color:white;font:14px sans-serif}iframe{display:block;width:100%;height:100%;border:0}#result{position:fixed;bottom:0;left:0;max-height:45vh;overflow:auto;background:#081724;z-index:999;white-space:pre-wrap}</style>
<iframe id="game" title="Game preview"></iframe><output id="result">Loading test harness…</output>
<script>
// Developer-only harness. Open through a dedicated local HTTP origin.
// Component fixtures never write campaign saves; ?production and ?squads use the actual campaign UI.
// Default: two-soldier tactical fixture. ?health: deterministic Build Health.
// ?objectives: a many-team decision sheet for viewport, layering, and action checks.
// ?database[&empty][&layout=standard]: real Mainframe component with known/locked fixture records.
// ?barracks[&empty][&layout=standard]: long local roster, recovery patient, and transfer dialog.
// ?production=research|workshop[&empty][&funding][&layout=standard]: seeded new-campaign setup.
// ?squads[&empty][&layout=standard]: local/remote squad assignments with wounded and transit exclusions.
// ?health&baseline: compare an earlier packaged host copied to /__mobile_baseline.html.
const params=new URLSearchParams(location.search), frame=document.querySelector('#game'), result=document.querySelector('#result');
frame.src=params.has('baseline')?'../__mobile_baseline.html':'../index.html?qa='+Date.now();
const deadline=Date.now()+30000;
const ready=setInterval(()=>{
  if(Date.now()>deadline){clearInterval(ready);result.textContent='Game load timed out. Check that the local server and requested packaged host are available.';return;}
  const host=frame.contentWindow,w=host.document.querySelector('#aegis-runtime')?.contentWindow;
  if(!w?.makeNewGameData||!w.document.querySelector('[data-aegis-layout-choice]'))return;
  clearInterval(ready);
  try{
    if(params.has('health')){
      w.writeAegisInterfaceLayout('standard');let seed=123456789;w.Math.random=()=>((seed=(Math.imul(seed,1664525)+1013904223)>>>0)/4294967296);
      w.executeDeferredFullBuildHealth();const tests=w.runSelfTests();
      result.textContent=JSON.stringify({passed:tests.filter(x=>x.pass).length,total:tests.length,failed:tests.filter(x=>!x.pass).map(x=>x.name)},null,2);frame.style.display='none';result.style.maxHeight='100vh';result.style.top='0';
    }else if(params.has('database')){
      w.writeAegisInterfaceLayout(params.get('layout')==='standard'?'standard':'mobile');
      const species=w.eval('Object.keys(ALIEN_DATABASE_INTEL)').slice(0,4),empty=params.has('empty');
      // Leave one known species without an autopsy, even in the populated late-campaign fixture.
      const tech=empty?[]:w.eval('Object.keys(RESEARCH_TREE)').filter(topic=>topic!==w.alienAutopsyTopic(species[0]));
      const gearInventory=empty?{}:Object.fromEntries(w.supplyItemNames({}).filter(name=>w.supplyCatalogEntry(name)?.alienRecovered).map(name=>[name,1]));
      w.document.getElementById('root').style.display='none';
      const mount=w.document.createElement('div');w.document.body.appendChild(mount);
      function DatabaseFixture(){
        const [selected,setSelected]=w.React.useState(null),layout=w.useAegisInterfaceLayout(),noop=()=>{};
        result.textContent=JSON.stringify({selected,layout,empty});
        return w.React.createElement('div',{'data-aegis-command-root':'true','data-aegis-active-tab':'database'},
          layout==='mobile'&&w.React.createElement(w.AegisMobileCommandRails,{tabs:[['geoscape',null,'Geoscape'],['base',null,'Base'],['inventory',null,'Quartermaster'],['database',null,'Mainframe Database'],['soldiers',null,'Soldiers']],tab:'database',onTab:noop,onMenu:noop,onCommand:noop,onIncidents:noop,onUfos:noop,onPause:noop,onMute:noop}),
          w.React.createElement('div',{className:'mx-auto'},w.React.createElement(w.MainframeDatabaseScreen,{identifiedAliens:empty?[]:species,tech,gearInventory,alienFieldBeaconKnowledge:empty?'unknown':'confirmed',selectedDatabaseAlien:selected,setSelectedDatabaseAlien:setSelected})));
      }
      w.ReactDOM.createRoot(mount).render(w.React.createElement(DatabaseFixture));result.style.display='none';
    }else if(params.has('squads')){
      w.writeAegisInterfaceLayout(params.get('layout')==='standard'?'standard':'mobile');
      const originalNewGame=w.makeNewGameData;
      w.makeNewGameData=setup=>{
        const game=originalNewGame(setup),origin=game.bases[0],remote=w.initialBase({name:'QA Remote Garrison',region:'Europe'});
        origin.grid[1][2]='quarters';game.bases=[origin,remote];game.funds=10000;
        game.soldiers=params.has('empty')?[]:Array.from({length:24},(_,i)=>({...w.makeSoldier('Rookie',i>=20?remote.id:origin.id),id:'qa-squad-soldier-'+i,name:i===2?'Alexandria Longname Montgomery':`QA Trooper ${String(i).padStart(2,'0')}`,status:i===17?'Wounded 5d':i===18?'Overflow 4d':i===19?'KIA':'Ready'}));
        if(game.soldiers[16])game.soldiers[16].transfer={id:'qa-transit',originBaseId:origin.id,destinationBaseId:remote.id,status:'In Transit',remainingMinutes:600,totalMinutes:600,costK:50};
        game.squads=params.has('empty')?[]:[
          {...w.makeSquad(1,[]),id:'qa-squad-local',name:'QA Home Squad',baseId:origin.id,soldierIds:[game.soldiers[0].id,game.soldiers[1].id],capacity:6},
          {...w.makeSquad(2,[]),id:'qa-squad-remote',name:'QA Remote Squad',baseId:remote.id,soldierIds:[game.soldiers[20].id],capacity:6}
        ];
        game.activeSquadId=game.squads[0]?.id||null;game.tab='squads';game.geoscapeClockRunning=false;
        return game;
      };
      result.style.display='none';
    }else if(params.has('production')){
      w.writeAegisInterfaceLayout(params.get('layout')==='standard'?'standard':'mobile');
      const originalNewGame=w.makeNewGameData;
      w.makeNewGameData=setup=>{
        const game=originalNewGame(setup),origin=game.bases[0],remote=w.initialBase({name:'QA Remote Production',region:'Europe'});
        origin.grid[1][2]='workshop';origin.grid[1][3]='quarters';
        game.bases=[origin,remote];game.funds=10000;game.engineers=10;game.tech=['Ballistic Weapons','Laser Weapons','Alien Alloys'];
        const names=w.availableWorkshopItems(game.tech),catalog=w.eval('WORKSHOP_ITEMS');
        game.baseInventories={[origin.id]:{...game.gearInventory,[names[0]]:3},[remote.id]:{...game.gearInventory}};
        game.workshopOrders=params.has('empty')?[]:Array.from({length:6},(_,i)=>{
          const name=names[i%names.length],item=catalog[name],paused=i===0&&params.has('funding');
          return {id:'qa-order-'+i,itemName:name,quantity:paused?3:1,paidItems:1,completed:paused?1:0,progress:paused?item.work:0,pausedForFunding:paused,assignedEngineers:1,destinationBaseId:origin.id,destinationBaseName:origin.name};
        });
        game.research=params.has('empty')?{topic:null,progress:0,assignedScientists:0}:{topic:w.availableResearchTopics(game.tech,null,game.gearInventory)[0],progress:0,assignedScientists:5};
        game.tab=params.get('production')==='workshop'?'workshop':'research';game.geoscapeClockRunning=false;
        return game;
      };
      result.style.display='none';
    }else if(params.has('barracks')){
      w.writeAegisInterfaceLayout(params.get('layout')==='standard'?'standard':'mobile');
      const game=w.makeNewGameData({openingIncidentSeed:12345}),origin={...game.bases[0],name:'QA Headquarters'},destination=w.initialBase({name:'QA Remote Base',region:'Europe'}),emptyBase=w.initialBase({name:'QA Empty Base',region:'Africa'}),bases=[origin,destination,emptyBase];
      const initial=params.has('empty')?[]:Array.from({length:24},(_,i)=>({...game.soldiers[i%game.soldiers.length],id:'qa-soldier-'+i,name:i===0?'Alexandria Longname Montgomery':`QA Soldier ${String(i).padStart(2,'0')}`,callsign:'',baseId:i===23?destination.id:origin.id,status:i===22?'Overflow 5d':'Ready'}));
      w.document.getElementById('root').style.display='none';
      const mount=w.document.createElement('div');w.document.body.appendChild(mount);
      function BarracksFixture(){
        const [soldiers,setSoldiers]=w.React.useState(initial),[baseId,setBaseId]=w.React.useState(origin.id),[sortKey,setSort]=w.React.useState('name'),[lastAction,setLastAction]=w.React.useState(null),layout=w.useAegisInterfaceLayout(),noop=()=>{};
        const selectedBase=bases.find(base=>base.id===baseId),local=w.sortBarracksSoldiers(soldiers.filter(s=>s.baseId===baseId),sortKey,game.tech);
        const transfer=(soldierId,toBase)=>{setLastAction({type:'transfer',soldierId,toBase});setSoldiers(rows=>rows.filter(s=>s.id!==soldierId));};
        const admit=soldierId=>{setLastAction({type:'admit',soldierId});setSoldiers(rows=>rows.filter(s=>s.id!==soldierId));};
        result.textContent=JSON.stringify({baseId,sortKey,local:local.length,lastAction,layout});
        const cards=local.map(soldier=>w.React.createElement(w.SoldierCard,{key:soldier.id,soldier,compact:true,showCombatPower:true,tech:game.tech,roster:soldiers,actions:String(soldier.status).startsWith('Overflow')?w.React.createElement('button',{onClick:()=>admit(soldier.id)},'Admit to Sickbay Bed'):w.React.createElement(w.SoldierTransferControls,{soldier,origin:selectedBase,bases,funds:2200,onConfirm:transfer})}));
        return w.React.createElement('div',{'data-aegis-command-root':'true','data-aegis-active-tab':'soldiers'},
          layout==='mobile'&&w.React.createElement(w.AegisMobileCommandRails,{tabs:[['geoscape',null,'Geoscape'],['base',null,'Base'],['inventory',null,'Quartermaster'],['database',null,'Mainframe Database'],['soldiers',null,'Soldiers']],tab:'soldiers',onTab:noop,onMenu:noop,onCommand:noop,onIncidents:noop,onUfos:noop,onPause:noop,onMute:noop}),
          w.React.createElement('div',{className:'mx-auto'},w.React.createElement(w.BarracksScreen,{bases,selectedBase,onSelectBase:setBaseId,sortKey,onSort:setSort,overview:w.React.createElement('div',null,'Base personnel fixture'),roster:w.React.createElement('div',{className:'grid gap-3 md:grid-cols-2 xl:grid-cols-3 2xl:grid-cols-4'},cards.length?cards:w.React.createElement('p',null,'No soldiers'))})));
      }
      w.ReactDOM.createRoot(mount).render(w.React.createElement(BarracksFixture));result.style.display='none';
    }else if(params.has('objectives')){
      w.writeAegisInterfaceLayout(params.get('layout')==='standard'?'standard':'mobile');
      const game=w.makeNewGameData({openingIncidentSeed:12345});
      w.document.getElementById('root').style.display='none';
      const mount=w.document.createElement('div');w.document.body.appendChild(mount);
      const root=w.ReactDOM.createRoot(mount),Overlay=w.eval('FireTeamObjectiveAssignmentOverlay');
      const teams=Array.from({length:8},(_,i)=>({id:'qa-team-'+i,label:'Review Fire Team '+(i+1),members:[{...game.soldiers[i%game.soldiers.length],fireTeamRole:'leader'}]}));
      const objectives=[{id:'qa-rescue',label:'Rescue VIPs',detail:'Locate and extract the civilians.',x:10,y:12},{id:'qa-beacon',label:'Alien Field Beacon',detail:'Destroy the discovered field beacon.',x:20,y:22},{id:'qa-search',label:'Search Area',detail:'Sweep the remaining unexplored terrain.',x:30,y:32}];
      let choices={};
      const report=action=>{result.textContent=JSON.stringify({action,choices});};
      const finish=action=>{root.unmount();result.style.display='block';report(action);};
      const render=()=>root.render(w.React.createElement(Overlay,{prompt:{reason:'discovery',newObjectiveIds:['qa-beacon']},teams,objectives,choices,
        onChange:(id,value)=>{choices={...choices,[id]:value};report('changed');render();},
        onDefaultAll:()=>{choices={};report('defaults');render();},onCancel:()=>finish('cancelled'),onApply:()=>finish('applied')}));
      render();result.style.display='none';report('open');
    }else{
      w.writeAegisInterfaceLayout('mobile');
      const game=w.makeNewGameData({openingIncidentSeed:12345});
      w.document.getElementById('root').style.display='none';
      const mount=w.document.createElement('div');w.document.body.appendChild(mount);
      w.ReactDOM.createRoot(mount).render(w.React.createElement(w.TacticalMission,{mission:game.missions[0],squad:game.soldiers.slice(0,2),tech:game.tech,onFinish:()=>{result.style.display='block';result.textContent='Mission finished';}}));
      result.style.display='none';
    }
  }catch(error){result.textContent=error.stack;}
},100);
</script>
